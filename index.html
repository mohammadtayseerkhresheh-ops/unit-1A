        let studentName = "";
        let currentQuestionIndex = 0;
        let questions = [];
        let userAnswers = {};

        function shuffleExam() {
            questions = rawQuestions.map(q => {
                let originalOptions = [...q.options];
                let correctAnswerText = originalOptions[q.answer];
                
                let shuffledOptions = originalOptions
                    .map(value => ({ value, sort: Math.random() }))
                    .sort((a, b) => a.sort - b.sort)
                    .map(({ value }) => value);

                let newCorrectIndex = shuffledOptions.indexOf(correctAnswerText);

                return {
                    ...q,
                    options: shuffledOptions,
                    answer: newCorrectIndex
                };
            });

            questions.sort(() => Math.random() - 0.5);
        }

        function startExam() {
            const nameInput = document.getElementById("student-name").value.trim();
            const errorElement = document.getElementById("name-error");

            if (!nameInput) {
                errorElement.classList.remove("hidden");
                return;
            }
            errorElement.classList.add("hidden");
            studentName = nameInput;

            document.getElementById("display-student-name").innerText = "الطالب: " + studentName;

            shuffleExam();
            userAnswers = {};
            currentQuestionIndex = 0;

            document.getElementById("welcome-screen").classList.add("hidden");
            document.getElementById("exam-screen").classList.remove("hidden");

            loadQuestion();
        }

        function loadQuestion() {
            const q = questions[currentQuestionIndex];
            
            document.getElementById("question-counter").innerText = `السؤال ${currentQuestionIndex + 1} من ${questions.length}`;

            const passageContainer = document.getElementById("passage-container");
            const passageText = document.getElementById("passage-text");
            if (q.passage) {
                passageText.innerHTML = q.passage;
                passageContainer.classList.remove("hidden");
            } else {
                passageContainer.classList.add("hidden");
            }

            document.getElementById("question-text").innerHTML = q.text;

            const optionsContainer = document.getElementById("options-container");
            optionsContainer.innerHTML = "";

            q.options.forEach((opt, idx) => {
                let isChecked = userAnswers[currentQuestionIndex] === idx ? "checked" : "";
                let borderColor = isChecked ? "border-indigo-600 bg-indigo-50" : "border-gray-200 hover:bg-gray-50";

                let optionHtml = `
                    <label class="flex items-center justify-between p-4 border ${borderColor} rounded-xl cursor-pointer transition">
                        <span class="text-lg text-gray-800 en-text">${opt}</span>
                        <input type="radio" name="question-option" value="${idx}" ${isChecked} onchange="selectOption(${idx})" class="w-5 h-5 text-indigo-600 focus:ring-indigo-500">
                    </label>
                `;
                optionsContainer.innerHTML += optionHtml;
            });

            document.getElementById("prev-btn").disabled = currentQuestionIndex === 0;
            
            const nextBtn = document.getElementById("next-btn");
            if (currentQuestionIndex === questions.length - 1) {
                nextBtn.innerText = "إنهاء الامتحان";
            } else {
                nextBtn.innerText = "التالي";
            }
        }

        function selectOption(optionIndex) {
            userAnswers[currentQuestionIndex] = optionIndex;
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion();
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            } else {
                finishExam();
            }
        }

        function finishExam() {
            let score = 0;
            questions.forEach((q, idx) => {
                if (userAnswers[idx] === q.answer) {
                    score++;
                }
            });

            let finalGrade = Math.round((score / questions.length) * 100);

            document.getElementById("exam-screen").classList.add("hidden");
            document.getElementById("result-screen").classList.remove("hidden");
            document.getElementById("result-name").innerText = studentName;
            document.getElementById("final-score").innerText = finalGrade;

            let reviewContainer = document.getElementById("review-container");
            reviewContainer.innerHTML = "";

            questions.forEach((q, idx) => {
                let userAns = userAnswers[idx];
                let isCorrect = userAns === q.answer;
                let userAnsText = userAns !== undefined ? q.options[userAns] : "لم تقم بالإجابة";
                let correctAnsText = q.options[q.answer];

                let reviewItem = `
                    <div class="p-4 rounded-xl border ${isCorrect ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'}">
                        <p class="font-bold text-gray-900 mb-1 en-text">Q${idx + 1}: ${q.text}</p>
                        <p class="text-sm ${isCorrect ? 'text-green-700' : 'text-red-700'}">إجابتك: <span class="en-text font-semibold">${userAnsText}</span></p>
                        ${!isCorrect ? `<p class="text-sm text-green-700 font-semibold mt-1">الإجابة الصحيحة: <span class="en-text">${correctAnsText}</span></p>` : ''}
                    </div>
                `;
                reviewContainer.innerHTML += reviewItem;
            });

            saveResultToFirebase(studentName, finalGrade);
        }

        function saveResultToFirebase(name, grade) {
            const resultsRef = db.ref('exam_results');
            resultsRef.push({
                studentName: name,
                score: grade,
                timestamp: new Date().toLocaleString('ar-JO')
            }).catch(error => {
                console.error("خطأ في الحفظ بقاعدة البيانات: ", error);
            });
        }

        function openTeacherModal() {
            document.getElementById("teacher-modal").classList.remove("hidden");
        }

        function closeTeacherModal() {
            document.getElementById("teacher-modal").classList.add("hidden");
            document.getElementById("teacher-password").value = "";
        }

        function verifyTeacher() {
            const pass = document.getElementById("teacher-password").value;
            if (pass === "MK1978mk") {
                closeTeacherModal();
                document.getElementById("welcome-screen").classList.add("hidden");
                document.getElementById("dashboard-screen").classList.remove("hidden");
                fetchResults();
            } else {
                alert("كلمة المرور غير صحيحة!");
            }
        }

        function fetchResults() {
            const resultsRef = db.ref('exam_results');
            resultsRef.on('value', (snapshot) => {
                const data = snapshot.val();
                const tbody = document.getElementById("results-table-body");
                tbody.innerHTML = "";

                if (data) {
                    Object.values(data).forEach(item => {
                        let row = `
                            <tr class="border-b hover:bg-gray-50">
                                <td class="p-3 font-semibold">${item.studentName}</td>
                                <td class="p-3"><span class="bg-indigo-100 text-indigo-800 px-2.5 py-1 rounded-full font-bold">${item.score} / 100</span></td>
                                <td class="p-3 text-gray-500 text-sm">${item.timestamp}</td>
                            </tr>
                        `;
                        tbody.innerHTML += row;
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-gray-500">لا توجد نتائج مسجلة حتى الآن.</td></tr>`;
                }
            });
        }

        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('copy', e => e.preventDefault());
        
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && !document.getElementById("exam-screen").classList.contains("hidden")) {
                alert("تنبيه: محاولة مغادرة شاشة الامتحان أو فتح تبويب آخر تُعتبر مخالفة لقواعد الامتحان!");
            }
        });
    </script>
</body>
</html>
